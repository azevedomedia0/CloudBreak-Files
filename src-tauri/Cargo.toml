[package]
name = "cloudbreak-files"
version = "0.1.2"
description = "Cloudbreak Files — multi-cloud storage with E2EE vault, photo studio, video tools, and private P2P libraries"
authors = ["Steven Azevedo <stevenazevedodesign@gmail.com>"]
edition = "2021"

[lib]
name = "cloudbreak_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon", "macos-private-api", "protocol-asset"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
tauri-plugin-dialog = "2"
trash = "5"

# Cryptography (AES-256-GCM & PBKDF2 & SHA-256)
aes-gcm = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
hmac = "0.12"
subtle = "2.5"
rand = "0.8"
base64 = "0.22"
hex = "0.4"

# Image processing & metadata
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

# Async HTTP Client for multi-cloud APIs (S3, GDrive, Dropbox)
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
ed25519-dalek = { version = "2", features = ["rand_core", "serde"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
zeroize = { version = "1", features = ["zeroize_derive"] }
parking_lot = "0.12"
portable-pty = "0.8"
tauri-plugin-updater = "2.13.2"
tauri-plugin-process = "2.4.0"

# Cloud provider tokens/passwords in the OS credential store.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSButton", "NSControl", "NSView", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["linux-native", "sync-secret-service", "crypto-rust"] }

# Debug builds run the PBKDF2 key derivation at full speed, so tests and `tauri dev` stay fast.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.aes-gcm]
opt-level = 3
