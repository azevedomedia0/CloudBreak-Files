[package]
name = "cloudbreak-files"
version = "0.1.0"
description = "Cloudbreak Files — multi-cloud storage with E2EE vault, photo studio, video tools, and private P2P libraries"
authors = ["Steven Azevedo <stevenazevedodesign@gmail.com>"]
edition = "2021"

[lib]
name = "cloudbreak_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }

# Cryptography (AES-256-GCM & PBKDF2 & SHA-256)
aes-gcm = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
hmac = "0.12"
subtle = "2.5"
rand = "0.8"
base64 = "0.22"
hex = "0.4"

# Image processing & metadata
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

# Async HTTP Client for multi-cloud APIs (S3, GDrive, Dropbox)
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
ed25519-dalek = { version = "2", features = ["rand_core", "serde"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
zeroize = { version = "1", features = ["zeroize_derive"] }
parking_lot = "0.12"
portable-pty = "0.8"

# Debug builds run the PBKDF2 key derivation at full speed, so tests and `tauri dev` stay fast.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.aes-gcm]
opt-level = 3
