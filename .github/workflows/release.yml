name: Release

# Builds installers for macOS (signed and notarized), Windows, and Linux Flatpak.
# Push a tag such as v0.1.0 to build, or run it by hand from the Actions tab.
# Each build uploads to a DRAFT release; publish it after testing the installers.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      upload_release_tag:
        description: 'If set, upload the Linux Flatpak to this existing release tag (e.g. v0.1.5)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    # Skip desktop matrix when this is a Flatpak-only manual upload to an existing tag.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.upload_release_tag == '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin --config src-tauri/tauri.ffmpeg.conf.json
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            args: ''
            rust_targets: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Use Cargo target dir outside the workspace
        if: matrix.os == 'macos-latest'
        run: |
          echo "CARGO_TARGET_DIR=${RUNNER_TEMP}/cloudbreak-cargo-target" >> "$GITHUB_ENV"
          # Big Sur+ so older Intel Macs can run the universal binary (matches tauri.conf.json).
          echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Clear stale Xcode icon helpers (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          pkill -x ibtoold 2>/dev/null || true
          pkill -x actool 2>/dev/null || true

      - name: Fetch ffmpeg sidecars (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          bash scripts/fetch-ffmpeg.sh
          # Enable Tauri externalBin only when the binaries are present.
          printf '%s\n' '{"bundle":{"externalBin":["binaries/ffmpeg"]}}' > src-tauri/tauri.ffmpeg.conf.json

      # macOS only: import the Developer ID certificate into a temporary keychain
      # and write the App Store Connect API key to a file outside the repo.
      - name: Prepare macOS signing
        if: matrix.os == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain
          rm "$RUNNER_TEMP/cert.p12"
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY}.p8"
          chmod 600 "$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY}.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY}.p8" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only read on macOS. Empty on the other platforms, which build unsigned.
          APPLE_SIGNING_IDENTITY: ${{ matrix.os == 'macos-latest' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_ISSUER: ${{ matrix.os == 'macos-latest' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ matrix.os == 'macos-latest' && secrets.APPLE_API_KEY || '' }}
          # Signs updater artifacts (.tar.gz / .sig) and lets tauri-action upload latest.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Cloudbreak Files ${{ github.ref_name }}'
          releaseBody: 'Beta build. See the assets below to download.'
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}

      - name: Verify universal macOS binary (Intel + Apple Silicon)
        if: matrix.os == 'macos-latest'
        run: |
          APP="$(find "${CARGO_TARGET_DIR}" -path '*/release/bundle/macos/Cloudbreak Files.app' -type d | head -1)"
          test -n "$APP"
          BIN="$APP/Contents/MacOS/Cloudbreak Files"
          ARCHS="$(lipo -archs "$BIN")"
          echo "App binary architectures: $ARCHS"
          echo "$ARCHS" | grep -q 'x86_64'
          echo "$ARCHS" | grep -q 'arm64'
          if [[ -x "$APP/Contents/MacOS/ffmpeg" ]]; then
            FF_ARCHS="$(lipo -archs "$APP/Contents/MacOS/ffmpeg")"
            echo "Bundled ffmpeg architectures: $FF_ARCHS"
            echo "$FF_ARCHS" | grep -q 'x86_64'
            echo "$FF_ARCHS" | grep -q 'arm64'
          fi
          # Confirm the app advertises Big Sur+ (covers older Intel Macs).
          MIN="$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$APP/Contents/Info.plist" 2>/dev/null || true)"
          echo "LSMinimumSystemVersion: ${MIN:-unset}"
          test "$MIN" = "11.0"

  linux-flatpak:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          # Prefer Ayatana only — libappindicator3-dev conflicts with it on Ubuntu 22.04.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libayatana-appindicator3-dev \
            flatpak \
            flatpak-builder \
            appstream \
            dbus-x11 \
            elfutils \
            binutils \
            zstd \
            xz-utils

      - name: Use Cargo target dir outside the workspace
        run: echo "CARGO_TARGET_DIR=${RUNNER_TEMP}/cloudbreak-cargo-target" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Build .deb and Flatpak bundle
        env:
          SKIP_NPM_CI: '1'
        run: |
          chmod +x scripts/build-flatpak.sh
          npm run build:flatpak

      # Artifact first so a later immutable-release upload failure still preserves the .flatpak.
      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudbreak-files-flatpak
          path: |
            dist-flatpak/com.cloudbreak.files.flatpak
            flatpak/cloudbreak-files.deb
          if-no-files-found: error

      - name: Upload Flatpak to release
        if: startsWith(github.ref, 'refs/tags/') || inputs.upload_release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -n "${{ inputs.upload_release_tag }}" ]]; then
            TAG="${{ inputs.upload_release_tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          # Ensure a release exists (tag pushes may still be drafting via tauri-action).
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --draft \
              --prerelease \
              --title "Cloudbreak Files ${TAG}" \
              --notes "Beta build. See the assets below to download."
          fi
          # Draft releases are not always addressable via /releases/tags/{tag}.
          IMMUTABLE="$(gh release view "$TAG" --json isDraft,isImmutable 2>/dev/null \
            | jq -r 'if .isDraft then "false" else (.isImmutable // false | tostring) end' \
            || echo false)"
          if [[ "$IMMUTABLE" == "true" ]]; then
            echo "::error::Release ${TAG} is immutable — cannot upload Flatpak. Recreate the release without immutability, then re-run."
            exit 1
          fi
          gh release upload "$TAG" \
            dist-flatpak/com.cloudbreak.files.flatpak \
            --clobber
          DEB="$(find "${CARGO_TARGET_DIR}" -path '*/release/bundle/deb/*.deb' | head -1)"
          if [[ -n "$DEB" ]]; then
            # GitHub release asset names cannot contain spaces.
            DEB_UPLOAD="${RUNNER_TEMP}/Cloudbreak.Files_${TAG#v}_amd64.deb"
            cp -f "$DEB" "$DEB_UPLOAD"
            gh release upload "$TAG" "$DEB_UPLOAD" --clobber
          fi
