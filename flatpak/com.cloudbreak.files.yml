# Flatpak manifest — wraps the Tauri .deb into a sandboxed app.
# Build on Linux with: bash scripts/build-flatpak.sh
# Or via Docker: bash scripts/build-flatpak-docker.sh
# See docs/flatpak.md.

id: com.cloudbreak.files
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: cloudbreak-files

finish-args:
  # Windowing
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc
  # Cloud sync, updates, P2P
  - --share=network
  # Local Files browser + media
  - --filesystem=home
  - --filesystem=xdg-download
  - --filesystem=xdg-pictures
  - --filesystem=xdg-videos
  - --filesystem=xdg-music
  - --filesystem=xdg-documents
  - --filesystem=xdg-desktop
  # OS keyring (provider tokens)
  - --talk-name=org.freedesktop.secrets
  # Tray icon (tauri tray-icon feature)
  - --talk-name=org.kde.StatusNotifierWatcher
  - --env=FLATPAK=1

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - '*.la'
  - '*.a'

modules:
  # rclone powers "Quick sign-in (no setup)" for Google Drive. The app finds it next to its own binary (/app/bin).
  # Official release zips (MIT), pinned by SHA-256 from https://downloads.rclone.org/v1.75.2/SHA256SUMS.
  - name: rclone
    buildsystem: simple
    build-commands:
      - install -Dm755 rclone-v1.75.2-linux-*/rclone /app/bin/rclone
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://downloads.rclone.org/v1.75.2/rclone-v1.75.2-linux-amd64.zip
        sha256: 349ac8fba6ff65d6247043f1750cdcb518ec5d500ef91463a10d37c0ccdf3702
        strip-components: 0
      - type: archive
        only-arches: [aarch64]
        url: https://downloads.rclone.org/v1.75.2/rclone-v1.75.2-linux-arm64.zip
        sha256: 7e1e8d69654941b7b7df84ee74c5f7fb09cce7d5496947fb7bf16b55ff427d10
        strip-components: 0

  # ffmpeg for video trim and convert. Same pinned FFmpeg 7.1.1 source as the macOS build (scripts/build-ffmpeg-lgpl.sh)
  # and the same rule: LGPL only, no --enable-gpl or --enable-nonfree. That rules out libx264, so this ffmpeg has no
  # H.264 encoder: MP4 and MKV conversion are not available in the Flatpak (AVI, GIF and the audio formats are).
  # libmp3lame, libopus and libvpx come from the Freedesktop SDK; the build fails if the result is not LGPL.
  # --enable-vaapi builds the h264_vaapi encoder (libva, MIT). It only works where the GPU's VA-API driver is present.
  - name: ffmpeg
    buildsystem: simple
    build-commands:
      - |
        set -eu
        ./configure --prefix=/app \
          --disable-autodetect --disable-gpl --disable-nonfree \
          --disable-shared --enable-static --enable-pic \
          --disable-doc --disable-debug --disable-ffplay --disable-ffprobe \
          --enable-libmp3lame --enable-libopus --enable-libvpx --enable-zlib --enable-bzlib \
          --enable-vaapi
        make -j"$FLATPAK_BUILDER_N_JOBS"
        make install
      - |
        set -eu
        BUILDCONF="$(/app/bin/ffmpeg -hide_banner -buildconf)"
        if printf '%s' "$BUILDCONF" | grep -Eq -- '--enable-(gpl|nonfree|version3)'; then
          echo "error: this ffmpeg is not LGPL-only" >&2; exit 1
        fi
        ENCODERS="$(/app/bin/ffmpeg -hide_banner -encoders)"
        for enc in libvpx-vp9 libopus libmp3lame aac flac gif mpeg4 h264_vaapi; do
          printf '%s' "$ENCODERS" | grep -q " $enc " || { echo "error: ffmpeg lacks the $enc encoder" >&2; exit 1; }
        done
      - install -Dm644 COPYING.LGPLv2.1 /app/share/licenses/ffmpeg/COPYING.LGPLv2.1
    cleanup:
      - /share/ffmpeg
      - /lib/pkgconfig
    sources:
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-7.1.1.tar.xz
        sha256: 733984395e0dbbe5c046abda2dc49a5544e7e0e1e2366bba849222ae9e3a03b1

  - name: cloudbreak-files
    buildsystem: simple
    sources:
      - type: file
        path: com.cloudbreak.files.metainfo.xml
      - type: file
        path: com.cloudbreak.files.desktop
      # Populated by scripts/build-flatpak.sh (copy the Tauri .deb here).
      - type: file
        path: cloudbreak-files.deb
    build-commands:
      - set -eu
      - mkdir -p deb-extract
      - ar x cloudbreak-files.deb --output deb-extract
      - |
        set -eu
        if [ -f deb-extract/data.tar.zst ]; then
          tar -C deb-extract -xf deb-extract/data.tar.zst
        elif [ -f deb-extract/data.tar.xz ]; then
          tar -C deb-extract -xf deb-extract/data.tar.xz
        elif [ -f deb-extract/data.tar.gz ]; then
          tar -C deb-extract -xf deb-extract/data.tar.gz
        else
          echo "No data.tar.* in deb" >&2
          ls -la deb-extract >&2
          exit 1
        fi
      - |
        set -eu
        BIN=""
        for candidate in \
          deb-extract/usr/bin/cloudbreak-files \
          deb-extract/usr/bin/Cloudbreak\ Files \
          deb-extract/usr/bin/cloudbreak_files
        do
          if [ -x "$candidate" ]; then BIN="$candidate"; break; fi
        done
        if [ -z "$BIN" ]; then
          BIN="$(find deb-extract/usr/bin -type f -perm -111 2>/dev/null | head -n 1 || true)"
        fi
        test -n "$BIN"
        install -Dm755 "$BIN" /app/bin/cloudbreak-files
      - |
        set -eu
        for libdir in "deb-extract/usr/lib/Cloudbreak Files" deb-extract/usr/lib/cloudbreak-files; do
          if [ -d "$libdir" ]; then
            mkdir -p /app/lib/cloudbreak-files
            cp -a "$libdir"/. /app/lib/cloudbreak-files/
            find /app/lib/cloudbreak-files -type f -exec chmod 644 {} \;
            find /app/lib/cloudbreak-files -type d -exec chmod 755 {} \;
          fi
        done
      - |
        set -eu
        # Prefer our Flatpak desktop entry; fall back to the one from the .deb.
        if [ -f com.cloudbreak.files.desktop ]; then
          install -Dm644 com.cloudbreak.files.desktop /app/share/applications/com.cloudbreak.files.desktop
        else
          DESKTOP="$(find deb-extract/usr/share/applications -name '*.desktop' | head -n 1)"
          test -n "$DESKTOP"
          sed -e 's/^Icon=.*/Icon=com.cloudbreak.files/' \
              -e 's|^Exec=.*|Exec=cloudbreak-files|' \
              "$DESKTOP" > /tmp/com.cloudbreak.files.desktop
          install -Dm644 /tmp/com.cloudbreak.files.desktop /app/share/applications/com.cloudbreak.files.desktop
        fi
      - |
        set -eu
        ICON_SRC="$(find deb-extract/usr/share/icons -type f -name '*.png' | sort | tail -n 1 || true)"
        if [ -z "$ICON_SRC" ] && [ -f deb-extract/usr/share/pixmaps/cloudbreak-files.png ]; then
          ICON_SRC=deb-extract/usr/share/pixmaps/cloudbreak-files.png
        fi
        if [ -n "$ICON_SRC" ]; then
          install -Dm644 "$ICON_SRC" /app/share/icons/hicolor/256x256/apps/com.cloudbreak.files.png
          install -Dm644 "$ICON_SRC" /app/share/icons/hicolor/128x128/apps/com.cloudbreak.files.png
        fi
        for size in 32x32 128x128; do
          src="$(find "deb-extract/usr/share/icons/hicolor/$size" -type f -name '*.png' 2>/dev/null | head -n 1 || true)"
          if [ -n "$src" ]; then
            install -Dm644 "$src" "/app/share/icons/hicolor/$size/apps/com.cloudbreak.files.png"
          fi
        done
      - install -Dm644 com.cloudbreak.files.metainfo.xml /app/share/metainfo/com.cloudbreak.files.metainfo.xml
