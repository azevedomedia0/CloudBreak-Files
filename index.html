<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        var p = JSON.parse(localStorage.getItem('cloudbreak.preferences.v1') || '{}');
        if (p.theme === 'light' || p.theme === 'dark' || p.theme === 'glacial') {
          document.documentElement.setAttribute('data-theme', p.theme);
          document.documentElement.style.colorScheme = p.theme === 'dark' ? 'dark' : 'light';
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/png" href="/icon.png" />
    <title>Cloudbreak Files</title>
    <meta name="description" content="Cloudbreak Files — multi-account cloud storage with client-side E2E encryption, photo editing, video tools, and private P2P library sharing." />
    <meta property="og:title" content="Cloudbreak Files" />
    <meta property="og:description" content="Cloudbreak Files — multi-account cloud storage with client-side E2E encryption, photo editing, video tools, and private P2P library sharing." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body class="bg-neutral-950 text-neutral-100 antialiased selection:bg-cyan-500/30 selection:text-cyan-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
