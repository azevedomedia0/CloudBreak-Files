[package]
name = "cloudbreak-files-linux"
version = "0.1.0"
description = "Cloudbreak Files — native Linux port for the COSMIC desktop"
authors = ["Steven Azevedo <stevenazevedodesign@gmail.com>"]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.80"

[[bin]]
name = "cloudbreak-files"
path = "src/main.rs"

[features]
default = ["cosmic-ui"]
cosmic-ui = ["dep:libcosmic"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.38", features = ["full"] }
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
base64 = "0.22"
walkdir = "2"
mime_guess = "2"

# Cryptography
aes-gcm = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
hmac = "0.12"
subtle = "2.5"
rand = "0.8"
hex = "0.4"
zeroize = { version = "1", features = ["zeroize_derive"] }
ed25519-dalek = { version = "2", features = ["rand_core", "serde"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"

# Image adjustments (photo pipeline)
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

# COSMIC desktop UI — on Pop!_OS add "wayland" to this features list.
libcosmic = { git = "https://github.com/pop-os/libcosmic", default-features = false, features = [
    "wgpu",
    "winit",
    "tokio",
    "a11y",
], optional = true }

[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.aes-gcm]
opt-level = 3

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.38", features = ["rt-multi-thread", "macros"] }
